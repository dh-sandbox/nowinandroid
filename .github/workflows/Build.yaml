name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_apk:
    name: "Local tests and APKs"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Check build-logic
        run: ./gradlew :build-logic:convention:check

      - name: Check spotless
        run: ./gradlew spotlessCheck

      - name: Check Dependency Guard
        run: ./gradlew dependencyGuard

      - name: Run local tests
        run: ./gradlew testDemoDebug :lint:test

      - name: Generate coverage reports
        run: ./gradlew createDemoDebugCombinedCoverageReport

      - name: Upload coverage to Qlty
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: '**/build/reports/jacoco/**/*Report.xml'
          format: jacoco
          skip-errors: false
          skip-missing-files: true
        env:
          JACOCO_SOURCE_PATH: >-
            app/src/main/kotlin
            core/analytics/src/main/kotlin
            core/analytics/src/demo/kotlin
            core/common/src/main/kotlin
            core/data/src/main/kotlin
            core/data-test/src/main/kotlin
            core/database/src/main/kotlin
            core/datastore/src/main/kotlin
            core/datastore-test/src/main/kotlin
            core/designsystem/src/main/kotlin
            core/domain/src/main/kotlin
            core/model/src/main/kotlin
            core/navigation/src/main/kotlin
            core/network/src/main/kotlin
            core/network/src/demo/kotlin
            core/notifications/src/main/kotlin
            core/notifications/src/demo/kotlin
            core/screenshot-testing/src/main/kotlin
            core/testing/src/main/kotlin
            core/ui/src/main/kotlin
            feature/bookmarks/api/src/main/kotlin
            feature/bookmarks/impl/src/main/kotlin
            feature/foryou/api/src/main/kotlin
            feature/foryou/impl/src/main/kotlin
            feature/interests/api/src/main/kotlin
            feature/interests/impl/src/main/kotlin
            feature/search/api/src/main/kotlin
            feature/search/impl/src/main/kotlin
            feature/settings/impl/src/main/kotlin
            feature/topic/api/src/main/kotlin
            feature/topic/impl/src/main/kotlin
            lint/src/main/kotlin
            sync/work/src/main/kotlin
            sync/work/src/demo/kotlin
            sync/sync-test/src/main/kotlin

      - name: Build all build type and flavor permutations
        run: ./gradlew :app:assemble -PminifyWithR8=false

      - name: Upload build outputs (APKs)
        uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: '**/build/outputs/apk/**/*.apk'

      - name: Upload JVM local results (XML)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: local-test-results
          path: '**/build/test-results/test*UnitTest/**.xml'

      - name: Check lint
        run: ./gradlew :app:lintProdRelease :app-nia-catalog:lintRelease :lint:lint

      - name: Upload lint reports (HTML)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'

      - name: Check badging
        run: ./gradlew :app:checkProdReleaseBadging
